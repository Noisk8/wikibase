# QuickStatements resolves shared Vue templates relative to localhost.
Alias "/magnustools/public_html/resources/vue/" "/var/www/html/magnustools/public_html/resources/vue/"
<Directory "/var/www/html/magnustools/public_html/resources/vue">
    Options None
    AllowOverride None
    SetHandler default-handler
    Require all denied
    <FilesMatch "\.html$">
        Require all granted
    </FilesMatch>
</Directory>
